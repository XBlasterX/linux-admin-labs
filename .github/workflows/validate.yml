name: Bash validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check Bash syntax
        run: git ls-files -z '*.sh' | xargs -0 -r -n1 bash -n
      - name: Run non-privileged fixture and stub tests
        run: |
          test "$(id -u)" -ne 0
          bash tests/run.sh
